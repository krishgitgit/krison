  </g>
  
  <!-- Text JAS-ANZ -->
  <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.02em" fill="#0f2742">JAS-ANZ</text>
  
  <!-- URL / Register -->
  <text x="65" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="6.5" letter-spacing="0.05em" fill="#526071">WWW.JAS-ANZ.ORG/REGISTER</text>
