<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 60" fill="none" class="h-10 sm:h-12 w-auto">
  <!-- JAS-ANZ Lockup -->
  <!-- Globe / Symbol -->
  <g transform="translate(4, 5)">
    <circle cx="25" cy="25" r="23" stroke="#0f2742" stroke-width="2" fill="none"/>
    <ellipse cx="25" cy="25" rx="14" ry="23" stroke="#0f2742" stroke-width="1.2" fill="none"/>
    <line x1="2" y1="25" x2="48" y2="25" stroke="#0f2742" stroke-width="1.2"/>
    <line x1="6" y1="14" x2="44" y2="14" stroke="#0f2742" stroke-width="1" stroke-dasharray="1 1"/>
    <line x1="6" y1="36" x2="44" y2="36" stroke="#0f2742" stroke-width="1" stroke-dasharray="1 1"/>
    <!-- Dynamic arc -->
