<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 60" fill="none" class="h-10 sm:h-12 w-auto">
  <!-- ISO 9001:2008 Lockup -->
  <!-- Circular Badge -->
  <g transform="translate(4, 5)">
    <circle cx="25" cy="25" r="23" stroke="#121417" stroke-width="1.8" fill="none"/>
    <circle cx="25" cy="25" r="19" stroke="#121417" stroke-width="0.8" fill="none"/>
    <!-- Check / Laurel motif -->
    <path d="M 17 25 L 22 31 L 33 18" stroke="#cb040a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="25" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="5" text-anchor="middle" letter-spacing="0.08em" fill="#121417">CERTIFIED</text>
  </g>
  
  <!-- Text Lockup -->
  <text x="64" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="17" letter-spacing="-0.01em" fill="#121417">ISO 9001:2008</text>
  <text x="65" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="0.06em" fill="#526071">QUALITY MANAGEMENT SYSTEM</text>
  <text x="65" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="6.5" letter-spacing="0.1em" fill="#88929e">REGISTERED STANDARDS</text>
</svg>
