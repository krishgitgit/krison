<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 60" fill="none" class="h-10 sm:h-12 w-auto">
  <!-- CCL Certification Lockup -->
  <g transform="translate(4, 5)">
    <!-- Hex / Shield Emblem -->
    <polygon points="25,2 47,14 47,38 25,48 3,38 3,14" stroke="#121417" stroke-width="1.8" fill="none"/>
    <circle cx="25" cy="25" r="16" stroke="#121417" stroke-width="1" fill="none"/>
    <!-- Stylized interlocking C mark -->
    <path d="M 30 18 A 8 8 0 1 0 30 32" stroke="#cb040a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 23 20 A 5.5 5.5 0 1 0 23 30" stroke="#121417" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Text Lockup -->
  <text x="60" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="0.06em" fill="#121417">CCL</text>
  <text x="61" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="0.08em" fill="#526071">CERTIFICATION</text>
  <text x="61" y="49" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="6.5" letter-spacing="0.08em" fill="#88929e">SYSTEM ACCREDITATION</text>
</svg>
