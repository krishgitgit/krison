<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 60" fill="none" class="h-10 sm:h-12 w-auto">
  <!-- IAF Lockup -->
  <g transform="translate(10, 5)">
    <!-- Oval Base -->
    <ellipse cx="75" cy="25" rx="72" ry="24" fill="#1b4588"/>
    
    <!-- White Inner Oval Grid Frame -->
    <ellipse cx="75" cy="25" rx="55" ry="18" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" fill="none"/>
    <ellipse cx="75" cy="25" rx="35" ry="18" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6" fill="none"/>
    <ellipse cx="75" cy="25" rx="16" ry="18" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6" fill="none"/>
    <line x1="20" y1="25" x2="130" y2="25" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6"/>
    <line x1="25" y1="17" x2="125" y2="17" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.5"/>
    <line x1="25" y1="33" x2="125" y2="33" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.5"/>
    
    <!-- IAF Text -->
    <text x="75" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="0.04em" fill="#ffffff">IAF</text>
    
    <!-- Top & Bottom Arc Text (approximated for crisp rendering) -->
    <text x="75" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="4.2" text-anchor="middle" letter-spacing="0.12em" fill="#ffffff">MEMBER OF MULTILATERAL</text>
    <text x="75" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="4.2" text-anchor="middle" letter-spacing="0.12em" fill="#ffffff">RECOGNITION ARRANGEMENT</text>
  </g>
</svg>
